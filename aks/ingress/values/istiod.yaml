resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaleMin: 2
global:
  proxy:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
pilot:
  autoscaleEnabled: true
meshConfig:
  accessLogFile: /dev/stdout
  defaultConfig:
    gatewayTopology:
      numTrustedProxies: 1
  extensionProviders:
  - name: stdout
    envoyFileAccessLog:
      path: /dev/stdout
